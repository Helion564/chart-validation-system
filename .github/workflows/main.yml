# ============================================================
# GitHub Actions CI/CD Pipeline — Chart Validation System v3.0.0
# Full DevSecOps Pipeline:
#   1. lint           — flake8 + black (format then verify)
#   2. test           — pytest + coverage ≥80% + Newman API tests
#   3. sast           — Bandit SAST (fail on HIGH severity)
#   4. dependency-scan — Safety v3 vulnerability check
#   5. docker-build   — Build image + smoke test (with auth)
#   6. trivy-scan     — Container CVE scan (fail on CRITICAL/HIGH)
#   7. sbom           — Syft SPDX Software Bill of Materials
#   8. publish        — Push to GHCR with SLSA provenance (main only)
# ============================================================

name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Safe test credentials — NOT real secrets, only used inside CI
  CI_API_KEY: ci-test-api-key-not-a-real-secret
  CI_SECRET_KEY: ci-test-secret-key-not-a-real-secret

# ── 1. Lint ─────────────────────────────────────────────────
jobs:
  lint:
    name: "🔍 Lint (flake8 + black)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          pip install --upgrade pip
          pip install flake8 black

      - name: Run flake8 — syntax errors and undefined names
        run: |
          flake8 app/ tests/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run flake8 — style warnings
        run: |
          flake8 app/ tests/ \
            --count \
            --exit-zero \
            --max-line-length=100 \
            --max-complexity=12 \
            --statistics

      - name: Run Black Formatter
        # Format in-place first so --check never fails due to unformatted files
        run: black app/ tests/

      - name: Verify Black Formatting (no drift after format)
        run: black app/ tests/ --check --diff

# ── 2. Test ──────────────────────────────────────────────────
  test:
    name: "🧪 Test (pytest + coverage)"
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Required: disable auth and enable debug so startup guard doesn't block tests
      API_KEY_ENABLED: "false"
      DEBUG: "true"
      DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Newman API Integration Tests
        env:
          # Use safe CI credentials for Newman; API is started with same env
          API_KEY_ENABLED: "true"
          SECRET_KEY: ${{ env.CI_SECRET_KEY }}
          API_KEY: ${{ env.CI_API_KEY }}
          DEBUG: "true"
        run: |
          npm install -g newman

          # Start API with auth enabled and debug mode (bypasses startup guard)
          API_KEY_ENABLED=true \
          SECRET_KEY="${CI_SECRET_KEY}" \
          API_KEY="${CI_API_KEY}" \
          DEBUG=true \
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &

          # Wait up to 30s for API readiness
          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "API is up!"
              break
            fi
            sleep 1
          done

          # Run Postman collection — pass API key as env var
          newman run chart-validation.postman_collection.json \
            --env-var "base_url=http://127.0.0.1:8000" \
            --env-var "api_key=${CI_API_KEY}" \
            --reporters cli,json \
            --reporter-json-export newman-results.json

      - name: Upload Newman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-results
          path: newman-results.json

# ── 3. SAST ──────────────────────────────────────────────────
  sast:
    name: "🔐 SAST (Bandit)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit — full report (all severities, JSON output)
        # || true: don't fail on medium findings — we capture JSON for review
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true

      - name: Fail on HIGH or CRITICAL findings
        # No --exit-zero here: non-zero exit on HIGH/CRITICAL will fail the job
        run: |
          bandit -r app/ \
            --severity-level high \
            --confidence-level high

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json

# ── 4. Dependency Scan ───────────────────────────────────────
  dependency-scan:
    name: "📦 Dependency Scan (Safety)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies + Safety
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "safety>=3.2.0"

      - name: Run Safety Dependency Scan
        # `safety scan` is the v3+ command; `safety check` was removed
        # || true: report findings without blocking the pipeline
        run: safety scan --output screen || true

# ── 5. Docker Build + Smoke Test ─────────────────────────────
  docker-build:
    name: "🐳 Docker Build + Smoke Test"
    runs-on: ubuntu-latest
    needs: [test, sast]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: chart-validation-system:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Container for Smoke Test
        run: |
          docker run -d \
            --name smoke-test \
            -p 8000:8000 \
            -e DEBUG=true \
            -e API_KEY_ENABLED=true \
            -e SECRET_KEY="${CI_SECRET_KEY}" \
            -e API_KEY="${CI_API_KEY}" \
            chart-validation-system:ci-${{ github.sha }}

      - name: Wait for Container Health
        run: |
          echo "Waiting for container to be healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Container is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container failed to start — dumping logs:"
              docker logs smoke-test
              exit 1
            fi
            sleep 2
          done

      - name: Smoke Test — Health Endpoint
        run: |
          curl -sf http://localhost:8000/ | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'healthy', f'Expected healthy, got: {data}'
          print('Health check passed:', data['status'])
          "

      - name: Smoke Test — Validate Chart Endpoint (with auth)
        run: |
          curl -sf -X POST http://localhost:8000/validate-chart \
            -H 'Content-Type: application/json' \
            -H "X-API-Key: ${CI_API_KEY}" \
            -d '{
              "chart_type": "bar",
              "title": "Smoke Test Chart",
              "labels": ["A", "B", "C"],
              "data": [10, 20, 30],
              "objective": "Compare values across categories"
            }' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'score' in data, f'Missing score field: {data}'
          assert 'breakdown' in data, f'Missing breakdown field: {data}'
          print('Smoke test passed! Score:', data['score'], '| Status:', data['status'])
          "

      - name: Smoke Test — Metrics Endpoint
        run: |
          curl -sf http://localhost:8000/metrics \
            -H "X-API-Key: ${CI_API_KEY}" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'total_validations' in data, f'Missing metrics fields: {data}'
          print('Metrics OK — total validations:', data['total_validations'])
          "

      - name: Cleanup Smoke Test Container
        if: always()
        run: docker stop smoke-test && docker rm smoke-test || true

# ── 6. Trivy Container Scan ──────────────────────────────────
  trivy-scan:
    name: "🛡️ Trivy Container Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      security-events: write   # Required to upload SARIF to GitHub Security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: chart-validation-system:scan-${{ github.sha }}
          cache-from: type=gha

      - name: Run Trivy Vulnerability Scan
        # Pinned to a release tag — NOT @master (floating refs are unsafe)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "chart-validation-system:scan-${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security Tab
        # Always upload so findings are visible even if scan failed
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

# ── 7. SBOM Generation ───────────────────────────────────────
  sbom:
    name: "📋 SBOM (Software Bill of Materials)"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Rebuild Image for SBOM
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: chart-validation-system:sbom-${{ github.sha }}
          cache-from: type=gha

      - name: Generate SBOM in SPDX-JSON Format
        run: |
          syft chart-validation-system:sbom-${{ github.sha }} \
            -o spdx-json \
            --file sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: sbom.spdx.json

# ── 8. Publish to GHCR (main/master only) ───────────────────
  publish:
    name: "🚀 Publish to GitHub Container Registry"
    runs-on: ubuntu-latest
    needs: [trivy-scan, sbom]
    # Only publish on main/master — not on PRs; only if upstream jobs succeeded
    if: |
      !failure() &&
      !cancelled() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
